<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>EPICSSCH Campo</title>
<!--
  Tablero de campo sin conexión de EPICSSCH (Epidemiología Regional, CSS Chiriquí).
  Esta página NO trae ningún dato: el brote (o el evento de desastre) se le carga
  con el archivo de configuración que descarga el módulo. Lo capturado se guarda
  CIFRADO en el equipo con la clave de acceso, y sale CIFRADO con la clave pública
  del brote o del evento: solo el módulo de la app puede abrirlo.
  Tres cuestionarios sobre el mismo motor (decisión T1, 15-oct-2026): la entrevista
  de brote (tipo BROTE), el día del punto con sus señales de la vigilancia
  intensificada ante desastres (tipo VID) y la investigación perifocal de
  Vacunación EIP (tipo PERIFOCO: caso índice y viviendas con sus miembros; tipo
  VACUNACION: registro de vacunación por persona, con sus dosis, desde el 16-oct-2026).
  Fuente: EPICSSCH_APP/tablero_campo/ (se publica copiando esta carpeta).
-->
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --fg:#14212e; --muted:#5a6878; --line:#d5dde6;
  --accent:#1f4e79; --accent-fg:#fff; --accent-soft:#e3edf6;
  --ok:#1e6b45; --ok-soft:#e1f2e8; --warn:#8a5300; --warn-soft:#fbf0dc; --bad:#a3271f; --bad-soft:#fbe7e5;
  --radius:10px; --tap:44px;
  font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161d; --surface:#17212b; --fg:#e4eaf0; --muted:#9aa8b6; --line:#2b3947;
  --accent:#7fb2e0; --accent-fg:#0f161d; --accent-soft:#1b2d3f;
  --ok:#6fcf9b; --ok-soft:#14301f; --warn:#e6b25c; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1714; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-fg);padding:10px 14px;display:flex;align-items:center;gap:10px}
header.bar b{font-size:1.02rem}
header.bar .sp{flex:1}
header.bar button{background:transparent;color:var(--accent-fg);border:1px solid currentColor;border-radius:8px;min-height:36px;padding:4px 10px;font:inherit;font-size:.85rem}
nav.tabs{display:flex;gap:4px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:56px;z-index:4}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;min-height:var(--tap)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h1{font-size:1.3rem;margin:0 0 6px} h2{font-size:1.08rem;margin:0 0 10px} h3{font-size:.95rem;margin:12px 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:.85rem}
label.f{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%;min-height:var(--tap);font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:var(--tap);min-width:56px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tri .seg button{min-width:48px;padding:6px 8px}
.aviso{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.aviso.warn{background:var(--warn-soft);color:var(--warn)} .aviso.bad{background:var(--bad-soft);color:var(--bad)} .aviso.ok{background:var(--ok-soft);color:var(--ok)} .aviso.info{background:var(--accent-soft);color:var(--accent)}
.lista .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lista .it .tx{flex:1;min-width:0}
.lista .it .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.CASO{background:var(--bad-soft);color:var(--bad)} .pill.CONTROL{background:var(--ok-soft);color:var(--ok)}
.pill.BORRADOR{background:var(--warn-soft);color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.secnav a{flex:none;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--line);overflow-x:auto;padding-top:6px}
.bars div{flex:none;width:18px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.bars div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:.65rem;color:var(--muted)}
.ejes{display:flex;gap:2px;overflow-x:auto;font-size:.6rem;color:var(--muted)}
.ejes div{flex:none;width:18px;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:44px}
.bloqueo{max-width:420px;margin:40px auto}
details.sind{border-bottom:1px solid var(--line)}
details.sind summary{display:flex;gap:10px;align-items:center;min-height:var(--tap);cursor:pointer;padding:4px 0;list-style:none}
details.sind summary::-webkit-details-marker{display:none}
details.sind summary span{flex:1;min-width:0}
details.sind summary::after{content:"+";font-weight:700;color:var(--muted);width:18px;text-align:center}
details.sind[open] summary::after{content:"\2212"}
.tot{min-width:28px;text-align:center;font-size:.8rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:2px 8px}
.tot:empty{display:none}
.g3{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px;gap:6px 8px;align-items:center;padding:4px 0 12px}
.g3 .hd{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center}
.g3 .hd.l{text-align:left;font-weight:600;color:var(--fg);font-size:.88rem}
.g3 input{text-align:center;padding:6px 4px}
.pill.PEND{background:var(--warn-soft);color:var(--warn)} .pill.OK{background:var(--ok-soft);color:var(--ok)}
.oculto{display:none!important}
</style>

<body>
<header class="bar"><b>EPICSSCH Campo</b><span class="sp"></span><span id="hdr_brote" class="small"></span><button id="btn_bloquear" class="oculto" type="button">Bloquear</button></header>
<nav class="tabs oculto" id="tabs" role="tablist"></nav>
<main id="app"><div class="card"><p>Cargando…</p></div></main>
<div class="fab oculto" id="fab"><button class="btn pri" id="btn_nueva" type="button">+ Nueva entrevista</button></div>
<input type="file" id="file_cfg" accept=".json,application/json" class="oculto">

<script>
"use strict";
/* ============================================================================
   MOTOR COMÚN (almacenamiento cifrado, clave de acceso, exportación cifrada)
   ========================================================================== */
const APP_VERSION = "1.4.2";
const CFG_SCHEMA = "epicssch.campo.config";
const PKG_SCHEMA = "epicssch.campo.paquete";
const CIF_SCHEMA = "epicssch.campo.cifrado";
const RETENCION_DIAS = 30;
const BLOQUEO_MIN = 10;
const te = new TextEncoder(), td = new TextDecoder();
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = buf => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15; return (c === "x" ? r : (r & 3) | 8).toString(16); }));
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const ahoraHM = () => new Date().toTimeString().slice(0, 5);
function canon(v) {           // JSON con claves ordenadas: misma huella en cualquier equipo
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  return JSON.stringify(v ?? null);
}
// Cada configuración tiene su identificador: el CODBROTE en Brotes, la referencia
// VID-<evento>-<unidad> en Desastres, PF-<evento>-<fecha>-<sufijo> en Perifoco.
// Los registros viejos de Brotes no traen cfg.
const cfgId = c => c ? (c.ref || c.codbrote) : null;
const regCfg = r => r.cfg || r.codbrote;
const etiquetaCfg = c => c.tipo === "VID" ? "Desastre · " + c.unidad : c.tipo === "PERIFOCO" ? "Perifoco · " + c.localidad.comunidad : c.tipo === "VACUNACION" ? "Vacunación · " + c.jornada.instalacion.abrev : c.codbrote;
async function sha256hex(txt) { const h = await crypto.subtle.digest("SHA-256", te.encode(txt)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }

// ── IndexedDB (con respaldo en memoria si el navegador la niega) ──────────────
const DB = (() => {
  let db = null, mem = { cfg: new Map(), reg: new Map() }, enMemoria = false;
  function abrir() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open("epicssch_campo", 1);
        rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore("cfg"); d.createObjectStore("reg", { keyPath: "uuid" }); };
        rq.onsuccess = () => { db = rq.result; res(true); };
        rq.onerror = () => { enMemoria = true; res(false); };
      } catch (e) { enMemoria = true; res(false); }
    });
  }
  function tx(store, modo, fn) {
    if (enMemoria) return Promise.resolve(fn(null));
    return new Promise((res, rej) => { const t = db.transaction(store, modo); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r instanceof IDBRequest ? r.result : r); t.onerror = () => rej(t.error); });
  }
  return {
    abrir, get enMemoria() { return enMemoria; },
    get: (st, k) => enMemoria ? Promise.resolve(mem[st].get(k)) : tx(st, "readonly", s => s.get(k)),
    put: (st, v, k) => enMemoria ? Promise.resolve(mem[st].set(k ?? v.uuid, v)) : tx(st, "readwrite", s => k === undefined ? s.put(v) : s.put(v, k)),
    del: (st, k) => enMemoria ? Promise.resolve(mem[st].delete(k)) : tx(st, "readwrite", s => s.delete(k)),
    all: st => enMemoria ? Promise.resolve([...mem[st].values()]) : tx(st, "readonly", s => s.getAll()),
    borrarTodo: () => enMemoria ? (mem = { cfg: new Map(), reg: new Map() }, Promise.resolve()) : Promise.all([tx("cfg", "readwrite", s => s.clear()), tx("reg", "readwrite", s => s.clear())])
  };
})();

// ── Clave de acceso: deriva la llave que cifra todo lo guardado en el equipo ──
const Llave = { k: null, ultimo: Date.now() };
async function derivar(pin, salt) {
  const base = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 210000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function cifrarLocal(obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, Llave.k, te.encode(JSON.stringify(obj))); return { iv: b64(iv), ct: b64(ct) }; }
async function descifrarLocal(c) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(c.iv) }, Llave.k, unb64(c.ct)); return JSON.parse(td.decode(pt)); }
async function crearClave(pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  Llave.k = await derivar(pin, salt);
  const prueba = await cifrarLocal({ ok: "epicssch" });
  await DB.put("cfg", { salt: b64(salt), prueba }, "bloqueo");
}
async function abrirConClave(pin) {
  const b = await DB.get("cfg", "bloqueo");
  const k = await derivar(pin, unb64(b.salt));
  Llave.k = k;
  try { const o = await descifrarLocal(b.prueba); if (o.ok !== "epicssch") throw 0; return true; } catch (e) { Llave.k = null; return false; }
}
function bloquear() { Llave.k = null; Estado.regs = []; pintar(); }
["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { Llave.ultimo = Date.now(); }, { passive: true }));
setInterval(() => { if (Llave.k && Date.now() - Llave.ultimo > BLOQUEO_MIN * 60000) bloquear(); }, 30000);

// ── Registros: metadatos a la vista, contenido cifrado ────────────────────────
async function guardarReg(r) {
  r.actualizado = new Date().toISOString();
  const c = await cifrarLocal(r);
  await DB.put("reg", { uuid: r.uuid, codbrote: regCfg(r), estado: r.estado, rol: r.rol || r.tipo_reg, actualizado: r.actualizado, exportado_en: r.exportado_en || null, ...c });
}
async function leerRegs() {
  const filas = await DB.all("reg"); const out = [];
  for (const f of filas) { try { const r = await descifrarLocal(f); r.exportado_en = f.exportado_en; out.push(r); } catch (e) { /* de otra clave: no se puede leer */ } }
  return out.sort((a, b) => (b.actualizado || "").localeCompare(a.actualizado || ""));
}
async function limpiarViejos() {     // T3: lo ya exportado se borra a los 30 días
  // Menos los puntos nuevos de Desastres: los días que se capturen después los siguen citando.
  const filas = await DB.all("reg"); const lim = Date.now() - RETENCION_DIAS * 86400000; let n = 0;
  for (const f of filas) if (f.exportado_en && f.rol !== "PUNTO" && Date.parse(f.exportado_en) < lim) { await DB.del("reg", f.uuid); n++; }
  return n;
}

// ── Exportación cifrada para el módulo ────────────────────────────────────────
// 64 bytes al azar por envío: los primeros 32 cifran (AES-GCM) y los otros 32
// firman (HMAC-SHA256 sobre iv + texto cifrado). Los 64 viajan envueltos con la
// clave pública RSA del brote (RSA-OAEP, SHA-1, lo que lee openssl::rsa_decrypt):
// solo el servidor, que guarda la privada, los abre. La firma HMAC existe porque
// openssl de R no verifica la etiqueta de GCM; sin ella, alguien podría alterar
// el archivo sin la llave y no se notaría.
async function exportarCifrado(cfg, regs) {
  const paquete = { schema_id: PKG_SCHEMA + "." + cfg.tipo.toLowerCase(), schema_version: APP_VERSION, codbrote: cfg.codbrote,
    exported_at: new Date().toISOString(), device_id: Estado.device, total: regs.length, registros: regs };
  paquete.sha256 = await sha256hex(canon(paquete));
  return sellarSobre(cfg, paquete, regs.length, paquete.exported_at, { codbrote: cfg.codbrote });
}
// Envuelve cualquier paquete (el de Brotes o el de Desastres) en el sobre cifrado.
async function sellarSobre(cfg, paquete, total, creado, extra) {
  const pub = await crypto.subtle.importKey("spki", unb64(cfg.clave.spki), { name: "RSA-OAEP", hash: "SHA-1" }, false, ["encrypt"]);
  const raw = crypto.getRandomValues(new Uint8Array(64));
  const k = await crypto.subtle.importKey("raw", raw.slice(0, 32), "AES-GCM", false, ["encrypt"]);
  const km = await crypto.subtle.importKey("raw", raw.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, te.encode(JSON.stringify(paquete))));
  const firmado = new Uint8Array(iv.length + ct.length); firmado.set(iv); firmado.set(ct, iv.length);
  const mac = await crypto.subtle.sign("HMAC", km, firmado);
  const ek = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pub, raw);
  return { schema_id: CIF_SCHEMA, schema_version: APP_VERSION, tipo: cfg.tipo, ...extra, kid: cfg.clave.kid,
    total, creado, ek: b64(ek), iv: b64(iv), ct: b64(ct), mac: b64(mac) };
}
async function entregarArchivo(nombre, texto) {
  const archivo = new File([texto], nombre, { type: "application/json" });
  // En el celular, la hoja de compartir lleva el archivo directo a WhatsApp o al correo.
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: nombre }); return "compartido"; }
    catch (e) { if (e && e.name === "AbortError") return "cancelado"; }
  }
  const url = URL.createObjectURL(archivo); const a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return "descargado";
}

/* ============================================================================
   ESTADO Y PANTALLAS
   ========================================================================== */
const Estado = { tab: "lista", cfgs: [], activo: null, regs: [], editando: null, device: null, entrevistador: "", aviso: null };
const cfgActiva = () => Estado.cfgs.find(c => cfgId(c) === Estado.activo) || null;

async function iniciar() {
  if (!window.isSecureContext || !crypto.subtle) {
    $("#app").innerHTML = `<div class="card"><h1>Abra el tablero desde su dirección segura</h1><p>Este equipo no permite cifrar en esta página. Ábrala desde la dirección https que le dio Epidemiología.</p></div>`;
    return;
  }
  await DB.abrir();
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) {} }
  if ("serviceWorker" in navigator && location.protocol === "https:") { try { await navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  vigilarVersion();
  Estado.device = (await DB.get("cfg", "device")) || uuid(); await DB.put("cfg", Estado.device, "device");
  Estado.cfgs = (await DB.get("cfg", "brotes")) || [];
  Estado.activo = (await DB.get("cfg", "activo")) || cfgId(Estado.cfgs[0]) || null;
  Estado.entrevistador = (await DB.get("cfg", "entrevistador")) || "";
  pintar();
}

/* ── Versión nueva publicada (16-oct-2026) ──────────────────────────────────
   Una pestaña abierta antes de publicar sigue con la versión vieja: la 1.3.0 tomó
   la configuración de vacunación por un brote y pidió «el código del brote». Con
   internet, al abrir y al volver a la pestaña (cada 30 min como mucho), se compara
   la versión publicada con la abierta y se ofrece actualizar. Lo guardado está en el
   equipo, cifrado: recargar no lo borra. */
let _verRevisada = 0;
async function vigilarVersion() {
  const revisar = async () => {
    if (location.protocol !== "https:" || !navigator.onLine || Date.now() - _verRevisada < 30 * 60 * 1000) return;
    _verRevisada = Date.now();
    try {
      const t = await (await fetch("index.html", { cache: "reload" })).text();
      const m = t.match(/const APP_VERSION = "([^"]+)"/);
      if (m && m[1] !== APP_VERSION) avisoVersionNueva(m[1]);
    } catch (e) {}
  };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") revisar(); });
  revisar();
}
function avisoVersionNueva(v) {
  if (document.getElementById("version_nueva")) return;
  const d = document.createElement("div");

$("#file_cfg").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const c = JSON.parse(await f.text());
    if (c.schema_id === "epicssch.vid.captura") throw new Error("Ese archivo es una captura ya exportada, no una configuración. Se carga en la app, no aquí.");
    if (c.schema_id !== CFG_SCHEMA) throw new Error("Ese archivo no es la configuración de un brote ni de un evento de EPICSSCH.");
    if (!c.clave || !c.clave.spki) throw new Error("Al archivo le falta su clave.");
    if (c.tipo === "VID") {
      if (!c.ref || !c.evento || !c.evento.id || !c.unidad || !Array.isArray(c.puntos) || !c.catalogos || !c.paquete)
        throw new Error("Al archivo del evento le faltan datos: descárguelo de nuevo en la app.");
    } else if (c.tipo === "PERIFOCO") {
      if (!c.ref || !c.evento || !c.evento.code || !c.localidad || !Array.isArray(c.sintomas) || !c.paquete)
        throw new Error("Al archivo del perifoco le faltan datos: descárguelo de nuevo en la app.");
    } else if (c.tipo === "VACUNACION") {
      if (!c.ref || !c.jornada || !c.jornada.instalacion || !c.catalogos || !Array.isArray(c.catalogos.vacunas) || !c.paquete)
        throw new Error("Al archivo de la jornada le faltan datos: descárguelo de nuevo en la app.");
    } else if (c.tipo && c.tipo !== "BROTE") {
      // Un cuestionario que esta versión no conoce: no es un brote sin código, es un tablero viejo.
      throw new Error(`Ese archivo es de un cuestionario (${c.tipo}) que esta versión del tablero (${APP_VERSION}) no conoce. Con internet, cierre y vuelva a abrir el tablero para tomar la versión nueva, y cárguelo de nuevo.`);
    } else if (!c.codbrote) throw new Error("Al archivo le falta el código del brote.");
    await crypto.subtle.importKey("spki", unb64(c.clave.spki), { name: "RSA-OAEP", hash: "SHA-1" }, false, ["encrypt"]);
    const previo = Estado.cfgs.find(x => cfgId(x) === cfgId(c));
    Estado.cfgs = Estado.cfgs.filter(x => cfgId(x) !== cfgId(c)).concat([c]);
    Estado.activo = cfgId(c);
    await DB.put("cfg", Estado.cfgs, "brotes"); await DB.put("cfg", Estado.activo, "activo");
    Estado.tab = ""; Estado.aviso = (c.tipo === "VID" ? `Evento ${c.nombre}, unidad ${c.unidad}, cargado` : c.tipo === "PERIFOCO" || c.tipo === "VACUNACION" ? `${c.nombre} cargado` : `Brote ${c.codbrote} cargado`) + (previo ? " (actualizado)." : "."); pintar();
  } catch (err) { const m = $("#msg"); if (m) m.innerHTML = `<div class="aviso bad">${esc(err.message || "No se pudo leer el archivo.")}</div>`; }
};

/* ============================================================================
   CUESTIONARIO DE BROTE
   ========================================================================== */
function seg(nombre, opciones, valor) {
  return `<div class="seg" data-seg="${nombre}">${opciones.map(([v, t]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${String(valor) === String(v)}">${esc(t)}</button>`).join("")}</div>`;
}
const SNN = [["S", "Sí"], ["N", "No"], ["NS", "No sabe"]];
function seccionesExposicion(c) {
  const secs = (c.exposiciones || []).map(s => ({ seccion: s.seccion, items: [...s.items] }));
  return secs;
}
function edadDesde(fnac, ref) { if (!fnac) return null; const a = new Date(fnac), b = new Date(ref || hoyISO()); let e = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) e--; return e >= 0 && e < 120 ? e : null; }
const enfermo = r => r.rol === "CASO" || (r.rol === "COHORTE" && r.enfermo === true);

function validar(r) {
  const e = [], a = [];
  if (!r.rol) e.push("Indique si es caso, control o miembro de la cohorte.");
  if (r.rol === "COHORTE" && r.enfermo === null) e.push("En la cohorte, indique si enfermó.");
  if (!r.persona.nombre) e.push("Falta el nombre.");
  if (!r.persona.sexo) e.push("Falta el sexo.");
  if (r.persona.edad == null || r.persona.edad === "") e.push("Falta la edad o la fecha de nacimiento.");
  if (enfermo(r) && !r.tiempo.fis) e.push("Falta la fecha de inicio de síntomas.");
  if (r.persona.cedula && !/^(\d{1,2}|PE|E|N|\d{1,2}(AV|PI))-\d{1,4}-\d{1,6}$/i.test(r.persona.cedula)) a.push("La cédula no tiene el formato habitual (por ejemplo 4-123-456).");
  if (!r.persona.cedula) a.push("Sin cédula no se puede enlazar con la notificación al cargar.");
  if (r.rol === "CONTROL") { const s = Object.values(r.clinica.sintomas || {}).filter(v => v === "S").length; if (s >= 2) a.push(`Un control con ${s} síntomas del brote: revise si no es un caso.`); }
  if (r.tiempo.fis && r.tiempo.fexp && r.tiempo.fexp > r.tiempo.fis) a.push("La exposición quedó después del inicio de síntomas.");
  if (r.tiempo.fis && r.tiempo.fis > hoyISO()) e.push("La fecha de inicio de síntomas es futura.");
  return { e, a };
}

    ${incubacionDe(r) != null ? `<p class="small muted" style="margin-top:8px">Período de incubación de esta persona: ${incubacionDe(r)} horas.</p>` : ""}</div>

  ${en ? `<div class="card" id="s_clinica"><h2>Signos y síntomas</h2>

      <div><label class="f" for="lb_f">Fecha de la muestra</label><input type="date" id="lb_f" data-k="laboratorio.fecha" value="${esc(r.laboratorio.fecha)}"></div></div>` : ""}

    <p class="small muted">Se guarda solo en este equipo, cifrado. Para que llegue al módulo hay que enviarlo desde la pestaña Enviar.</p></div>`;

function incubacionDe(r) {
  if (!r.tiempo.fis || !r.tiempo.fexp) return null;
  const a = Date.parse(r.tiempo.fexp + "T" + (r.tiempo.hexp || "12:00")), b = Date.parse(r.tiempo.fis + "T" + (r.tiempo.his || "12:00"));
  const h = (b - a) / 3600000; return h >= 0 ? Math.round(h * 10) / 10 : null;
}
function setRuta(o, ruta, val) { const p = ruta.split("."); let x = o; for (let i = 0; i < p.length - 1; i++) x = x[p[i]] = x[p[i]] || {}; x[p[p.length - 1]] = val; }

function enlazarEntrevista() {
  const r = Estado.editando, c = cfgActiva(), secsExp = seccionesExposicion(c);
  $("#btn_volver").onclick = () => { Estado.editando = null; pintar(); };
  $("#app").querySelectorAll("[data-k]").forEach(el => el.onchange = () => {
    let val = el.value; const k = el.dataset.k;
    if (k === "persona.edad") val = val === "" ? null : Number(val);
    setRuta(r, k, val);
    if (k === "persona.fnac") r.persona.edad = edadDesde(val, r.fecha_entrevista);
    if (k === "lugar.distrito") { r.lugar.cod_geo = ""; r.lugar.corregimiento = ""; }
    if (k === "lugar.cod_geo") { const g = (c.geografia || []).find(z => z.cod === val); r.lugar.corregimiento = g ? g.c : ""; }
    if (["persona.fnac", "persona.edad", "lugar.distrito", "tiempo.fis", "tiempo.fexp", "tiempo.his", "tiempo.hexp", "persona.cedula", "persona.nombre", "fecha_entrevista"].includes(k)) redibujar();
  });
  $("#app").querySelectorAll("[data-seg]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    const n = g.dataset.seg, v = b.dataset.v, cur = b.getAttribute("aria-pressed") === "true";
    const val = cur ? null : v;                         // tocar de nuevo deja la respuesta en blanco
    if (n === "rol") { r.rol = val; if (val !== "COHORTE") r.enfermo = null; }
    else if (n === "enfermo") r.enfermo = val === null ? null : val === "true";
    else if (n === "cumple") r.clinica.cumple = val;
    else if (n === "sexo") r.persona.sexo = val;
    else if (n === "embarazo") r.persona.embarazo = val;
    else if (n === "hosp") r.clinica.hospitalizado = val;
    else if (n === "muestra") r.laboratorio.muestra = val;
    else if (n.startsWith("sin:")) { const s = c.sintomas[+n.slice(4)]; if (val) r.clinica.sintomas[s] = val; else delete r.clinica.sintomas[s]; }
    else if (n.startsWith("exp:")) { const [, si, ii] = n.split(":"); const s = secsExp[+si]; const it = s.items[+ii]; r.exposiciones[s.seccion] = r.exposiciones[s.seccion] || {}; if (val) r.exposiciones[s.seccion][it] = val; else delete r.exposiciones[s.seccion][it]; }
    if (["rol", "enfermo", "sexo", "muestra"].includes(n)) redibujar();
    else g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === val)));
    refrescarValidacion();
  }));
  const guardar = async estado => {
    r.estado = estado; r.exportado_en = null; await guardarReg(r); Estado.regs = await leerRegs();
    Estado.editando = null; Estado.aviso = estado === "COMPLETA" ? "Entrevista guardada." : "Borrador guardado."; pintar(); window.scrollTo(0, 0);
  };
  $("#btn_completa").onclick = () => guardar("COMPLETA");
  $("#btn_borrador").onclick = () => guardar("BORRADOR");
  const el = $("#btn_eliminar");
  if (el) el.onclick = () => confirmar("Se elimina esta entrevista de este equipo.", "Eliminar", async () => { await DB.del("reg", r.uuid); Estado.regs = await leerRegs(); Estado.editando = null; pintar(); });
}
function redibujar() { const y = window.scrollY; pantallaEntrevista(); window.scrollTo(0, y); }
function refrescarValidacion() { const v = validar(Estado.editando); const b = $("#btn_completa"); if (b) b.disabled = v.e.length > 0; }

/* ============================================================================
   ANÁLISIS PRELIMINAR (casos y controles, o cohorte)
   ========================================================================== */
function orWoolf(a, b, c, d) {
  let A = a, B = b, C = c, D = d; if ([a, b, c, d].includes(0)) { A += .5; B += .5; C += .5; D += .5; }   // corrección de Haldane
  const or = (A * D) / (B * C), se = Math.sqrt(1 / A + 1 / B + 1 / C + 1 / D);
  return { or, li: Math.exp(Math.log(or) - 1.96 * se), ls: Math.exp(Math.log(or) + 1.96 * se) };
}
function rrIC(a, b, c, d) {   // a enfermos expuestos, b sanos expuestos, c enfermos no expuestos, d sanos no expuestos
  if (a + b === 0 || c + d === 0) return null;
  let A = a, C = c; if (a === 0 || c === 0) { A += .5; C += .5; }
  const r1 = A / (a + b), r0 = C / (c + d), rr = r1 / r0, se = Math.sqrt(1 / A - 1 / (a + b) + 1 / C - 1 / (c + d));
  return { ar1: a / (a + b), ar0: c / (c + d), rr, li: Math.exp(Math.log(rr) - 1.96 * se), ls: Math.exp(Math.log(rr) + 1.96 * se) };
}
const f2 = x => (x == null || !isFinite(x)) ? "—" : x.toFixed(2);
const pct = (n, d) => d ? Math.round(100 * n / d) + " %" : "—";
function mediana(v) { const s = [...v].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; }

function pantallaAnalisis() {
  const c = cfgActiva(), regs = Estado.regs.filter(r => regCfg(r) === cfgId(c) && r.estado === "COMPLETA");
  const casos = regs.filter(r => r.rol === "CASO"), ctrl = regs.filter(r => r.rol === "CONTROL"), coh = regs.filter(r => r.rol === "COHORTE");
  const enf = regs.filter(enfermo);
  const cohorte = coh.length > 0 && casos.length + ctrl.length === 0;
  // Síntomas entre los enfermos
  const sint = (c.sintomas || []).map(s => ({ s, n: enf.filter(r => r.clinica.sintomas[s] === "S").length, d: enf.filter(r => r.clinica.sintomas[s] === "S" || r.clinica.sintomas[s] === "N").length })).sort((a, b) => b.n - a.n);
  // Curva por fecha de inicio
  const fechas = enf.map(r => r.tiempo.fis).filter(Boolean).sort();
  let curva = "";
  if (fechas.length) {
    const d0 = new Date(fechas[0]), d1 = new Date(fechas[fechas.length - 1]); const dias = [];
    for (let d = new Date(d0); d <= d1 && dias.length < 60; d.setDate(d.getDate() + 1)) dias.push(d.toISOString().slice(0, 10));
    const cnt = dias.map(x => fechas.filter(f => f === x).length), mx = Math.max(...cnt, 1);
    curva = `<div class="bars">${cnt.map(n => `<div style="height:${Math.round(120 * n / mx)}px" title="${n}"><span>${n || ""}</span></div>`).join("")}</div><div class="ejes">${dias.map(x => `<div>${x.slice(8, 10)}/${x.slice(5, 7)}</div>`).join("")}</div>`;
  }
  const inc = enf.map(incubacionDe).filter(x => x != null);
  // Exposiciones
  const secs = seccionesExposicion(c); const filasExp = [];
  for (const s of secs) for (const it of s.items) {
    const val = r => (r.exposiciones[s.seccion] || {})[it];
    if (cohorte) {
      const a = coh.filter(r => r.enfermo && val(r) === "S").length, b = coh.filter(r => r.enfermo === false && val(r) === "S").length;
      const cc = coh.filter(r => r.enfermo && val(r) === "N").length, d = coh.filter(r => r.enfermo === false && val(r) === "N").length;
      if (a + b + cc + d === 0) continue; const x = rrIC(a, b, cc, d);
      filasExp.push({ it, s: s.seccion, txt: `<td class="n">${a}/${a + b}</td><td class="n">${pct(a, a + b)}</td><td class="n">${cc}/${cc + d}</td><td class="n">${pct(cc, cc + d)}</td><td class="n"><b>${x ? f2(x.rr) : "—"}</b></td><td class="n">${x ? f2(x.li) + "–" + f2(x.ls) : "—"}</td>`, orden: x ? x.rr : 0 });
    } else {
      const a = casos.filter(r => val(r) === "S").length, b = ctrl.filter(r => val(r) === "S").length;
      const cc = casos.filter(r => val(r) === "N").length, d = ctrl.filter(r => val(r) === "N").length;
      if (a + b + cc + d === 0) continue; const x = (a + cc) && (b + d) ? orWoolf(a, b, cc, d) : null;
      filasExp.push({ it, s: s.seccion, txt: `<td class="n">${a}/${a + cc}</td><td class="n">${pct(a, a + cc)}</td><td class="n">${b}/${b + d}</td><td class="n">${pct(b, b + d)}</td><td class="n"><b>${x ? f2(x.or) : "—"}</b></td><td class="n">${x ? f2(x.li) + "–" + f2(x.ls) : "—"}</td>`, orden: x ? x.or : 0 });
    }
  }
  filasExp.sort((a, b) => b.orden - a.orden);
  $("#app").innerHTML = `<div class="aviso warn">Preliminar, con las entrevistas completas de este equipo. El análisis oficial es el del módulo, con todas las entrevistas cargadas.</div>
  <div class="card"><h2>Resumen</h2><p>${casos.length} casos · ${ctrl.length} controles · ${coh.length} miembros de la cohorte (${coh.filter(r => r.enfermo).length} enfermaron)</p>
    ${inc.length ? `<p>Período de incubación (${inc.length} con fecha y hora de exposición e inicio): mínimo ${Math.min(...inc)} h, mediana ${mediana(inc)} h, máximo ${Math.max(...inc)} h.</p>` : `<p class="muted small">Para el período de incubación hacen falta fecha y hora de exposición y de inicio.</p>`}</div>
  <div class="card"><h2>Curva por fecha de inicio de síntomas</h2>${curva || `<p class="muted">Sin fechas de inicio todavía.</p>`}</div>
  <div class="card"><h2>Signos y síntomas en los enfermos</h2><div class="tbl"><table><thead><tr><th>Síntoma</th><th class="n">Con el síntoma</th><th class="n">%</th></tr></thead><tbody>
    ${sint.map(x => `<tr><td>${esc(x.s)}</td><td class="n">${x.n}/${x.d}</td><td class="n">${pct(x.n, x.d)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2>Exposiciones ${cohorte ? "(cohorte: tasa de ataque y RR)" : "(casos y controles: OR)"}</h2>
    <p class="small muted">«No sabe» no entra en el cálculo. Con un cero se aplica la corrección de Haldane (+0,5). IC 95 %.</p>
    <div class="tbl"><table><thead><tr><th>Exposición</th>${cohorte
      ? `<th class="n">Enfermos / expuestos</th><th class="n">TA expuestos</th><th class="n">Enfermos / no expuestos</th><th class="n">TA no expuestos</th><th class="n">RR</th><th class="n">IC 95 %</th>`
      : `<th class="n">Casos expuestos</th><th class="n">%</th><th class="n">Controles expuestos</th><th class="n">%</th><th class="n">OR</th><th class="n">IC 95 %</th>`}</tr></thead>
    <tbody>${filasExp.map(x => `<tr><td>${esc(x.it)}<br><span class="small muted">${esc(x.s)}</span></td>${x.txt}</tr>`).join("") || `<tr><td colspan="7" class="muted">Sin respuestas de exposición todavía.</td></tr>`}</tbody></table></div></div>`;
}

/* ── Enviar al módulo ─────────────────────────────────────────────────────── */
function pantallaEnviar() {
  const c = cfgActiva(), regs = Estado.regs.filter(r => regCfg(r) === cfgId(c));
  const comp = regs.filter(r => r.estado === "COMPLETA"), pend = comp.filter(r => !r.exportado_en), borr = regs.filter(r => r.estado === "BORRADOR");
  $("#app").innerHTML = `<div class="card"><h2>Enviar al módulo de Gestión de Brotes</h2>
    <p>${pend.length} entrevistas completas sin enviar · ${comp.length - pend.length} ya enviadas · ${borr.length} borradores (no se envían).</p>
    <p class="small muted">El archivo sale cifrado: solo el módulo de la app lo puede abrir. Mándelo por WhatsApp o correo a Epidemiología, que lo carga en la pestaña Tablero de campo del brote. Cargarlo dos veces no duplica nada.</p>
    <div id="msg"></div>
    <div class="btns"><button class="btn pri" id="btn_env" type="button" ${pend.length ? "" : "disabled"}>Enviar las ${pend.length} sin enviar</button>
    <button class="btn" id="btn_env_todo" type="button" ${comp.length ? "" : "disabled"}>Volver a enviar todas (${comp.length})</button></div></div>`;
  const env = async lista => {
    try {
      const pkg = await exportarCifrado(c, lista);
      const nombre = `brote_${c.codbrote}_${hoyISO()}_${lista.length}entrevistas.json`.replace(/[^A-Za-z0-9_.-]/g, "_");
      const res = await entregarArchivo(nombre, JSON.stringify(pkg));
      if (res === "cancelado") return;
      const ahora = new Date().toISOString();
      for (const r of lista) { r.exportado_en = ahora; await guardarReg(r); }
      Estado.regs = await leerRegs();
      Estado.aviso = res === "compartido" ? `Se compartió el archivo con ${lista.length} entrevistas.` : `Se descargó ${nombre}. Mándelo a Epidemiología.`;
      Estado.tab = "lista"; pintar();
    } catch (err) { $("#msg").innerHTML = `<div class="aviso bad">No se pudo preparar el archivo: ${esc(err.message || err)}</div>`; }
  };
  $("#btn_env").onclick = () => env(pend);
  $("#btn_env_todo").onclick = () => env(comp);
}

/* ============================================================================
   VIGILANCIA INTENSIFICADA ANTE DESASTRES (tipo VID)
   Las reglas son las de funciones_vid.R:
   - el día va de corte a corte (hora del evento, hora de Panamá) y lleva la
     fecha del corte que lo cierra;
   - un punto que reportó y no anotó un síndrome tiene 0; sin reportar es SD;
   - la fila 19 (lesiones de causa externa) no va en la grilla: sale de
     lesiones y defunciones;
   - sin nombres ni cédulas: ningún campo los pide y una cédula escrita se rechaza;
   - un punto abierto en el terreno queda pendiente de que Coordinación lo
     apruebe al cargar (decisión V2).
   Lo que se envía es el mismo paquete que lee vid_leer_paquete() en R, con su
   huella SHA-256 sobre el JSON canónico, dentro del sobre cifrado.
   ========================================================================== */
const PA_MS = -5 * 3600000;                     // Panamá: UTC-5, sin horario de verano
const enPanama = (d = new Date()) => new Date(d.getTime() + PA_MS);
const fechaPA = (d = new Date()) => enPanama(d).toISOString().slice(0, 10);
const horaPA = (d = new Date()) => enPanama(d).toISOString().slice(11, 16);
function diaCorte(c, d = new Date()) {
  const [h, m] = String(c.evento.hora_corte_local || "11:00").split(":").map(Number);
  const p = enPanama(d), min = p.getUTCHours() * 60 + p.getUTCMinutes() + (p.getUTCSeconds() > 0 ? 1 : 0);
  if (min > h * 60 + m) p.setUTCDate(p.getUTCDate() + 1);
  return p.toISOString().slice(0, 10);
}
const ddmm = f => f ? f.slice(8, 10) + "/" + f.slice(5, 7) : "";
const normNom = s => String(s || "").trim().toUpperCase().replace(/\s+/g, " ");
const nombreCat = (lista, cod) => ((lista || []).find(x => String(x.codigo) === String(cod)) || { nombre: cod }).nombre;
const plural = (n, a, b) => n + " " + (n === 1 ? a : b);
function traeCedula(c, t) { try { return !!t && new RegExp(c.catalogos.patron_cedula).test(String(t).toUpperCase()); } catch (e) { return false; } }
const esEntero = v => v === "" || v == null || (Number.isInteger(Number(v)) && Number(v) >= 0);
const ent = v => { const n = Number(v); return Number.isInteger(n) && n > 0 ? n : 0; };
const regsDe = (c, tipo) => Estado.regs.filter(r => regCfg(r) === cfgId(c) && r.tipo_reg === tipo);

// Puntos: los de la configuración y los abiertos en el terreno. Uno del terreno que
// ya llegó aprobado en una configuración nueva (mismo tipo y nombre) deja de ofrecerse.
function puntosVid(c) {
  const of = (c.puntos || []).map(p => ({ key: "p" + p.id, id: p.id, uuid: null, nombre: p.nombre, tipo: p.tipo, tipo_nombre: p.tipo_nombre, nuevo: false }));
  const nv = regsDe(c, "PUNTO").map(p => ({ key: "n" + p.uuid, id: null, uuid: p.uuid, nombre: p.nombre, tipo: p.tipo,
    tipo_nombre: nombreCat(c.catalogos.tipos_punto, p.tipo), nuevo: true, reg: p,
    aprobado: of.some(o => o.tipo === p.tipo && normNom(o.nombre) === normNom(p.nombre)) }));
  return of.concat(nv);
}
const puntoDe = (c, r) => puntosVid(c).find(p => r.punto_uuid ? p.uuid === r.punto_uuid : p.id === r.punto_id);
const nomPunto = (c, r) => { const p = puntoDe(c, r); return p ? p.nombre + (p.nuevo && !p.aprobado ? " (nuevo)" : "") : "Punto " + (r.punto_id ?? ""); };
const uuidDia = (c, key, dia) => "dia|" + cfgId(c) + "|" + key + "|" + dia;

function totalesDia(r) {
  const s = o => Object.values(o || {}).reduce((a, n) => a + ent(n), 0);
  return { casos: s(r.grilla), les: Object.values(r.les || {}).reduce((a, x) => a + ent(x.n), 0), def: s(r.def) };
}
function resumenDia(r) {

/* ── Ubicación (opcional, nunca obligatoria) ──────────────────────────────────

function textoUbic(r) {

}
function bloqueUbic(r, dec, dis) {
  const nota = dec === DEC_SENAL ? "Se guarda redondeada a unos 100 m: marca el lugar de la señal, no una casa." : "La del lugar donde está el punto.";
  return `<label class="f">Ubicación (opcional)</label>
    <p class="small ${tieneUbic(r) ? "" : "muted"}" id="ubic_txt">${tieneUbic(r) ? esc(textoUbic(r)) : "Sin ubicación."} <span class="muted">${esc(nota)}</span></p>
    ${dis ? "" : `<div class="btns" style="margin-top:0"><button class="btn" id="btn_ubic" type="button">${tieneUbic(r) ? "Tomar de nuevo" : "Tomar ubicación"}</button>
    ${tieneUbic(r) ? `<button class="btn" id="btn_ubic_q" type="button">Quitar</button>` : ""}</div>`}
    <div id="ubic_msg"></div>`;
}
// Pide la posición al aparato. listo() repinta la pantalla.
function enlazarUbic(r, dec, listo) {
  const b = $("#btn_ubic"), q = $("#btn_ubic_q"), msg = t => { $("#ubic_msg").innerHTML = t ? `<div class="aviso warn">${esc(t)}</div>` : ""; };
  if (q) q.onclick = () => { r.latitud = r.longitud = r.precision_m = null; listo(); };
  if (!b) return;
  b.onclick = () => {
    if (!("geolocation" in navigator)) return msg("Este equipo no da la ubicación. Puede guardar sin ella.");
    b.disabled = true; b.textContent = "Buscando la ubicación…"; msg("");
    navigator.geolocation.getCurrentPosition(p => {
      r.latitud = p.coords.latitude.toFixed(dec); r.longitud = p.coords.longitude.toFixed(dec);
      r.precision_m = Math.round(p.coords.accuracy); listo();
    }, e => {

      msg(e.code === 1 ? "El permiso de ubicación está negado. Actívelo en el navegador o guarde sin ubicación."
        : e.code === 3 ? "El aparato tardó demasiado en ubicarse. Pruebe al aire libre o guarde sin ubicación."
        : "No se pudo obtener la ubicación. Puede guardar sin ella.");

}

function validarDia(c, r) {
  const e = [], a = [], cat = c.catalogos, hoy = diaCorte(c);
  if (!r.punto_key) e.push("Elija el punto.");

  else if (r.dia > hoy) e.push("No se puede guardar un día que todavía no empieza.");
  if (r.morbilidad !== false) {
    cat.anexo1.forEach(f => { if (cat.grupos_edad.some(g => cat.sexos.some(s => !esEntero(r.grilla[f.codigo + "|" + g.codigo + "|" + s.codigo]))))
      e.push(`Fila ${f.fila} (${f.nombre}): anote números enteros, cero o más.`); });
    cat.mecanismos.forEach(m => { const x = r.les[m.codigo] || {};
      if (!esEntero(x.n) || !esEntero(x.h)) e.push(`${m.nombre}: anote números enteros, cero o más.`);
      else if (ent(x.h) > ent(x.n)) e.push(`${m.nombre}: hay más hospitalizados que lesionados.`); });
    cat.relacion_def.forEach(d => { if (!esEntero(r.def[d.codigo])) e.push(`${d.nombre}: anote un número entero, cero o más.`); });

    if (traeCedula(c, v.o)) e.push(`${x.nombre}: la observación no lleva cédulas.`); });
  if (r.morbilidad === false && !evaluados) e.push("Sin morbilidad y sin riesgos no hay nada que guardar.");
  const otro = Estado.regs.find(x => x.uuid === uuidDia(c, r.punto_key, r.dia));
  if (otro && otro.uuid !== r.uuid) a.push("Este día ya está guardado en este equipo: al guardar, lo reemplaza.");

function enlazarDia() {

function validarSenal(c, r) {

  if (!r.fecha || !/^\d{2}:\d{2}$/.test(r.hora || "")) e.push("Anote la fecha y la hora en que se detectó la señal.");
  else if (r.fecha + "T" + r.hora > fechaPA() + "T" + horaPA()) e.push("La hora de detección es futura.");
  if (!(r.lugar || "").trim()) e.push("Anote dónde se detectó la señal.");
  if (!r.senal) e.push("Elija la señal.");
  if (!r.fuente) e.push("Elija la fuente.");
  if (!esEntero(r.n_personas)) e.push("El número de personas va en entero, cero o más.");
  if (traeCedula(c, r.lugar) || traeCedula(c, r.descripcion) || traeCedula(c, r.avisado_a)) e.push("La señal no lleva cédulas ni nombres de pacientes: bórrelos y guarde de nuevo.");
  return { e, a: [] };
}

function diaAPaquete(c, r) {
  const cat = c.catalogos, consolidado = [], lesiones = [], riesgos = [];
  if (r.morbilidad !== false) {
    cat.anexo1.forEach(f => cat.grupos_edad.forEach(g => cat.sexos.forEach(s => {
      const n = ent(r.grilla[f.codigo + "|" + g.codigo + "|" + s.codigo]);
      if (n) consolidado.push({ sindrome: f.codigo, grupo_edad: g.codigo, sexo: s.codigo, casos: n }); })));
    cat.mecanismos.forEach(m => { const x = r.les[m.codigo] || {}, n = ent(x.n);
      if (n) lesiones.push({ tipo: "LESION", categoria: m.codigo, cantidad: n, hospitalizados: ent(x.h) }); });
    cat.relacion_def.forEach(d => { const n = ent(r.def[d.codigo]);
      if (n) lesiones.push({ tipo: "DEFUNCION", categoria: d.codigo, cantidad: n, hospitalizados: 0 }); });
  }
  cat.riesgos.forEach(x => { const v = r.ries[x.codigo]; if (v && v.e) riesgos.push({ rubro: x.codigo, estado: v.e, observacion: (v.o || "").trim() }); });
  const o = { punto_id: r.punto_id ?? null, dia: r.dia, capturado_en: r.capturado_en, morbilidad: r.morbilidad !== false, consolidado, lesiones, riesgos };
  if (r.punto_uuid) o.punto_uuid = r.punto_uuid;
  return o;
}
function senalAPaquete(r) {
  const o = { uuid: r.uuid, punto_id: r.punto_id ?? null, detectada_en: r.fecha + "T" + r.hora, lugar: r.lugar, senal: r.senal,
    n_personas: r.n_personas === "" || r.n_personas == null ? null : Number(r.n_personas), fuente: r.fuente, descripcion: r.descripcion || "",
    avisado_a: r.avisado_a || "", avisado_en: /^\d{2}:\d{2}$/.test(r.avisado_hora || "") ? r.fecha + "T" + r.avisado_hora : null };
  if (r.punto_uuid) o.punto_uuid = r.punto_uuid;
  return ubicAPaquete(o, r);
}
const puntoAPaquete = r => ubicAPaquete({ uuid: r.uuid, tipo: r.tipo, nombre: r.nombre, poblacion: r.poblacion === "" || r.poblacion == null ? null : Number(r.poblacion),
  distrito: r.distrito || null, corregimiento: r.corregimiento || null, codigo_geo: r.codigo_geo || null, creado_en: r.creado_en }, r);
// El paquete que lee vid_leer_paquete(): mismo esquema y misma huella.
async function paqueteVid(c, dias, sen, pts) {
  const p = { schema_id: c.paquete.schema_id, schema_version: c.paquete.schema_version, evento_id: c.evento.id, evento: c.evento.nombre,
    unidad: c.unidad, formulario_generado_en: c.generado, exportado_en: new Date().toISOString(),
    dias: dias.map(r => diaAPaquete(c, r)), senales: sen.map(senalAPaquete) };
  if (pts.length) p.puntos_nuevos = pts.map(puntoAPaquete);
  p.payload_sha256 = await sha256hex(canon(p));
  return p;
}
async function sobreVid(c, dias, sen) {
  const usados = new Set(dias.concat(sen).map(r => r.punto_uuid).filter(Boolean));
  const pts = regsDe(c, "PUNTO").filter(p => usados.has(p.uuid) || !p.exportado_en);
  const paq = await paqueteVid(c, dias, sen, pts);
  return { pts, sobre: await sellarSobre(c, paq, dias.length + sen.length, paq.exportado_en, { referencia: String(c.evento.id), ref: cfgId(c) }) };
}
function pantallaEnviarVid() {
  const c = cfgActiva(), dias = regsDe(c, "DIA"), sen = regsDe(c, "SENAL");
  const pd = dias.filter(r => !r.exportado_en), ps = sen.filter(r => !r.exportado_en), pp = regsDe(c, "PUNTO").filter(r => !r.exportado_en);
  const hayPend = pd.length + ps.length + pp.length > 0;
  $("#app").innerHTML = `<div class="card"><h2>Enviar a Vigilancia ante desastres</h2>
    <p>Sin enviar: ${plural(pd.length, "día", "días")}, ${plural(ps.length, "señal", "señales")}${pp.length ? `, ${plural(pp.length, "punto nuevo", "puntos nuevos")}` : ""}.
       Ya enviados: ${dias.length - pd.length} días y ${sen.length - ps.length} señales.</p>
    <p class="small muted">El archivo sale cifrado: solo la app lo puede abrir. Mándelo por WhatsApp o correo a Epidemiología, que lo carga en la pestaña Sin conexión del módulo. Cargarlo dos veces no duplica nada; si un día ya estaba guardado allá con otro contenido, Coordinación decide cuál queda.</p>
    <div id="msg"></div>
    <div class="btns"><button class="btn pri" id="btn_env" type="button" ${hayPend ? "" : "disabled"}>Enviar lo pendiente</button>
    <button class="btn" id="btn_env_todo" type="button" ${dias.length + sen.length ? "" : "disabled"}>Volver a enviar todo</button></div></div>`;
  const env = async (ld, ls) => {
    try {
      const { pts, sobre } = await sobreVid(c, ld, ls);
      const nombre = `vid_${c.unidad}_${fechaPA()}_${ld.length}dias_${ls.length}senales.json`.replace(/[^A-Za-z0-9_.-]/g, "_");
      const res = await entregarArchivo(nombre, JSON.stringify(sobre));
      if (res === "cancelado") return;
      const ahora = new Date().toISOString();
      for (const r of ld.concat(ls, pts)) { r.exportado_en = ahora; await guardarReg(r); }
      Estado.regs = await leerRegs();
      Estado.aviso = res === "compartido" ? `Se compartió el archivo: ${plural(ld.length, "día", "días")} y ${plural(ls.length, "señal", "señales")}.` : `Se descargó ${nombre}. Mándelo a Epidemiología.`;
      Estado.tab = "dias"; pintar();
    } catch (err) { $("#msg").innerHTML = `<div class="aviso bad">No se pudo preparar el archivo: ${esc(err.message || err)}</div>`; }
  };
  $("#btn_env").onclick = () => env(pd, ps);
  $("#btn_env_todo").onclick = () => env(dias, sen);
}

/* ============================================================================
   PERIFOCO (tipo PERIFOCO) — Vacunación EIP, 15-oct-2026
   Las reglas son las de funciones_perifoco_campo.R (pf_errores):
   - caso índice: nombre, sexo, edad y clasificación;
   - vivienda: su condición y, si está abierta, cuántas personas viven en ella;
   - cada persona tamizada: nombre, sexo y edad.
   Los síntomas son los del evento, los mismos del formulario PAI; se responde Sí,
   No o No interrogado. Las viviendas cerradas también se anotan: cuentan en el
   informe de perifoco. La app convierte lo enviado en una jornada EIP.
   ========================================================================== */
const SNI = [["si", "Sí"], ["no", "No"], ["no_interrogado", "No interr."]];
const VAC = [["si", "Sí"], ["no", "No"], ["desconocido", "No sabe"]];
const CEDULA_RE = /^(\d{1,2}|PE|E|N|\d{1,2}(AV|PI))-\d{1,4}-\d{1,6}$/i;
const edadNum = v => v !== "" && v != null && isFinite(Number(v)) && Number(v) >= 0;
const idDe = k => "pf_" + k.replace(/[^A-Za-z0-9]/g, "_");
function getRuta(o, ruta) { return ruta.split(".").reduce((x, k) => x == null ? undefined : x[k], o); }
function pfTexto(k, rot, v) { return `<label class="f" for="${idDe(k)}">${esc(rot)}</label><input type="text" id="${idDe(k)}" data-k="${k}" value="${esc(v)}" autocomplete="off">`; }
function pfFecha(k, rot, v) { return `<label class="f" for="${idDe(k)}">${esc(rot)}</label><input type="date" id="${idDe(k)}" data-k="${k}" value="${esc(v)}">`; }

function nuevoMiembroPf() {
  return { uuid: uuid(), nombre: "", apellido: "", cedula: "", sexo: null, edad_valor: "", edad_unidad: "años", sintomas: {},
    fis: "", fexantema: "", vacunado: null, muestra: null, tipo_muestra: [], clasificacion_post: "", observacion: "" };
}
function nuevoPf(c, tipo) {
  const base = { uuid: uuid(), cfg: cfgId(c), tipo_reg: tipo, estado: "BORRADOR", entrevistador: Estado.entrevistador, creado: new Date().toISOString() };
  Estado.editando = tipo === "CASO"
    ? { ...base, fecha: hoyISO(), persona: { edad_unidad: "años" }, clasificacion: null, fexp: "", lugar_exposicion: "", fis: "", fexantema: "",
        sintomas: {}, vacunado: null, muestra: null, tipo_muestra: [], observaciones: "" }
    : { ...base, fecha_visita: hoyISO(), numero: "", condicion: null, habitantes: "", calle_sector: "", punto_referencia: "", telefono: "",
        observaciones: "", miembros: [] };
  pintar(); window.scrollTo(0, 0);
}

function erroresPersona(p, quien) {
  const e = [];
  if (!String(p.nombre || "").trim()) e.push(`Falta el nombre de ${quien}.`);
  if (!["M", "F"].includes(p.sexo)) e.push(`Falta el sexo de ${quien}.`);
  if (!edadNum(p.edad_valor)) e.push(`Falta la edad de ${quien}.`);
  return e;
}
function validarPf(c, r) {
  const e = [], a = [];
  const ced = (p, quien) => { if (p.cedula && !CEDULA_RE.test(p.cedula)) a.push(`La cédula de ${quien} no tiene el formato habitual (por ejemplo 4-123-456).`); };
  const tam = (x, quien) => {
    const si = Object.values(x.sintomas || {}).filter(v => v === "si").length;
    if (x.fis && x.fis > hoyISO()) e.push(`La fecha de inicio de síntomas de ${quien} es futura.`);
    if (si && !x.fis) a.push(`${quien} tiene síntomas y no tiene fecha de inicio.`);
    if (x.muestra === "S" && !(x.tipo_muestra || []).length) a.push(`Indique el tipo de muestra de ${quien}.`);
    return si;
  };
  if (r.tipo_reg === "CASO") {
    e.push(...erroresPersona(r.persona, "el caso índice"));
    if (!(c.clasif_caso || []).some(x => x.code === r.clasificacion)) e.push("Indique si el caso es sospechoso, probable o confirmado.");
    ced(r.persona, "el caso índice"); tam(r, "el caso índice");
    if (r.fexp && r.fis && r.fexp > r.fis) a.push("La exposición quedó después del inicio de síntomas.");
  } else {
    if (!(c.condiciones || []).some(x => x.code === r.condicion)) e.push("Indique la condición de la vivienda.");
    if (r.condicion === "abierta") {
      if (!edadNum(r.habitantes) || !Number.isInteger(Number(r.habitantes))) e.push("Indique cuántas personas viven en la vivienda.");
      if (!r.miembros.length) a.push("Vivienda abierta sin ninguna persona tamizada.");
      else if (edadNum(r.habitantes) && r.miembros.length > Number(r.habitantes)) a.push("Hay más personas tamizadas que habitantes anotados.");
    } else if (r.miembros.length) a.push("La vivienda no está abierta y tiene personas tamizadas: revise la condición.");
    r.miembros.forEach((m, i) => {
      const q = String(m.nombre || "").trim() || `la persona ${i + 1}`;
      e.push(...erroresPersona(m, `la persona ${i + 1}`)); ced(m, q);
      const si = tam(m, q);
      if (si >= 2 && m.clasificacion_post === "Asintomático") a.push(`${q} tiene ${si} síntomas y quedó como asintomática.`);
    });
  }
  return { e, a };
}

function enlazarPf() {
  const r = Estado.editando, c = cfgActiva();
  const redibujarPf = () => { const y = window.scrollY; pantallaPfEdicion(); window.scrollTo(0, y); };
  const refrescar = () => { const v = validarPf(c, r); $("#pf_val").innerHTML = avisos(v); $("#btn_completa").disabled = v.e.length > 0; };
  $("#btn_volver").onclick = () => { Estado.editando = null; pintar(); };
  $("#app").querySelectorAll("[data-k]").forEach(el => el.onchange = () => { setRuta(r, el.dataset.k, String(el.value).trim()); refrescar(); });
  $("#app").querySelectorAll("[data-seg]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    const ruta = g.dataset.seg.slice(3), val = b.getAttribute("aria-pressed") === "true" ? null : b.dataset.v;   // tocar de nuevo la deja en blanco
    setRuta(r, ruta, val);
    if (/(^|\.)(condicion|muestra)$/.test(ruta)) {
      if (/muestra$/.test(ruta) && val !== "S") setRuta(r, ruta.replace(/muestra$/, "tipo_muestra"), []);
      return redibujarPf();
    }
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === val)));
    refrescar();
  }));
  $("#app").querySelectorAll("[data-chk]").forEach(b => b.onclick = () => {
    const lista = getRuta(r, b.dataset.chk) || [], v = b.dataset.v, i = lista.indexOf(v);
    if (i >= 0) lista.splice(i, 1); else lista.push(v);
    setRuta(r, b.dataset.chk, lista); b.setAttribute("aria-pressed", String(i < 0)); refrescar();
  });
  $("#app").querySelectorAll("details[data-mu]").forEach(d => d.ontoggle = () => { if (d.open) Estado.pfAbiertos.add(d.dataset.mu); else Estado.pfAbiertos.delete(d.dataset.mu); });
  $("#app").querySelectorAll("[data-quitar]").forEach(b => b.onclick = () => confirmar("Se quita a esta persona de la vivienda.", "Quitar", async () => { r.miembros.splice(+b.dataset.quitar, 1); redibujarPf(); }));
  const add = $("#btn_add_m");
  if (add) add.onclick = () => { const m = nuevoMiembroPf(); r.miembros.push(m); Estado.pfAbiertos.add(m.uuid); redibujarPf(); };
  const guardar = async estado => {
    r.estado = estado; r.exportado_en = null; await guardarReg(r); Estado.regs = await leerRegs();
    Estado.editando = null; Estado.aviso = estado === "COMPLETA" ? (r.tipo_reg === "CASO" ? "Caso índice guardado." : "Vivienda guardada.") : "Borrador guardado.";
    pintar(); window.scrollTo(0, 0);
  };
  $("#btn_completa").onclick = () => guardar("COMPLETA");
  $("#btn_borrador").onclick = () => guardar("BORRADOR");
  const el = $("#btn_eliminar");
  if (el) el.onclick = () => confirmar(r.tipo_reg === "CASO" ? "Se elimina el caso índice de este equipo." : "Se elimina esta vivienda, con sus personas, de este equipo.", "Eliminar",
    async () => { await DB.del("reg", r.uuid); Estado.regs = await leerRegs(); Estado.editando = null; pintar(); });
}

async function sobrePf(c, regs) {
  const paquete = { schema_id: c.paquete.schema_id, schema_version: APP_VERSION, ref: c.ref, exported_at: new Date().toISOString(),
    device_id: Estado.device, total: regs.length, registros: regs.map(r => { const x = structuredClone(r); delete x.exportado_en; return x; }) };
  paquete.sha256 = await sha256hex(canon(paquete));
  return sellarSobre(c, paquete, regs.length, paquete.exported_at, { ref: c.ref });
}
function pantallaEnviarPf() {
  const c = cfgActiva(), regs = Estado.regs.filter(r => regCfg(r) === cfgId(c));
  const comp = regs.filter(r => r.estado === "COMPLETA"), pend = comp.filter(r => !r.exportado_en), borr = regs.filter(r => r.estado === "BORRADOR");
  $("#app").innerHTML = `<div class="card"><h2>Enviar a PAICSSCH</h2>
    <p>${plural(pend.length, "registro completo sin enviar", "registros completos sin enviar")} · ${comp.length - pend.length} ya enviados · ${plural(borr.length, "borrador", "borradores")} (no se envían).</p>
    <p class="small muted">Cada vivienda viaja con sus personas. El archivo sale cifrado: solo la app lo puede abrir. Mándelo por WhatsApp o correo a Epidemiología, que lo carga en PAICSSCH, Perifoco sin conexión. Cargarlo dos veces no duplica nada.</p>
    <div id="msg"></div>
    <div class="btns"><button class="btn pri" id="btn_env" type="button" ${pend.length ? "" : "disabled"}>Enviar los ${pend.length} sin enviar</button>
    <button class="btn" id="btn_env_todo" type="button" ${comp.length ? "" : "disabled"}>Volver a enviar todo (${comp.length})</button></div></div>`;
  const env = async lista => {
    try {
      const sobre = await sobrePf(c, lista);
      const nombre = `perifoco_${c.ref}_${hoyISO()}_${lista.length}registros.json`.replace(/[^A-Za-z0-9_.-]/g, "_");
      const res = await entregarArchivo(nombre, JSON.stringify(sobre));
      if (res === "cancelado") return;
      const ahora = new Date().toISOString();
      for (const r of lista) { r.exportado_en = ahora; await guardarReg(r); }
      Estado.regs = await leerRegs();
      Estado.aviso = res === "compartido" ? `Se compartió el archivo con ${plural(lista.length, "registro", "registros")}.` : `Se descargó ${nombre}. Mándelo a Epidemiología.`;
      Estado.tab = "viviendas"; pintar();
    } catch (err) { $("#msg").innerHTML = `<div class="aviso bad">No se pudo preparar el archivo: ${esc(err.message || err)}</div>`; }
  };
  $("#btn_env").onclick = () => env(pend);
  $("#btn_env_todo").onclick = () => env(comp);
}

/* ============================================================================
   VACUNACIÓN (tipo VACUNACION) — registro de vacunación del PAI, 16-oct-2026
   Reemplaza al formulario HTML «Formulario en jornada». Las reglas son las de
   funciones_vacunacion_campo.R (vc_errores), las mismas del formulario:
   - nombre y apellido; número de identificación si el tipo no es «No tiene»;
   - fecha de nacimiento y sexo; nacimiento no posterior al registro;
   - embarazada: semanas de gestación;
   - cada dosis: vacuna y dosis; si se aplicó hoy, fecha y lote.
   Catálogos: los del formulario (catalogos_pai_vacunacion.json), en la configuración.
   ========================================================================== */
const vcCat = (c, l) => (c.catalogos && c.catalogos[l]) || [];
const vcLab = (c, l, code) => (vcCat(c, l).find(x => x.code === code) || { label: code || "" }).label;
// La lista de vacunas se muestra en orden alfabético, con «Otra» al final (pedido del
// 28-oct-2026 para el piloto del PAI). Se ordena aquí y no en el catálogo para que valga
// también con las configuraciones ya repartidas.
const vcAlfa = ops => ops.slice().sort((a, b) => (a.code === "otra") - (b.code === "otra") ||
  String(a.label).localeCompare(String(b.label), "es", { sensitivity: "base", numeric: true }));
function vcSelect(c, k, rot, lista, v, opciones) {
  const ops = opciones || (lista === "vacunas" ? vcAlfa(vcCat(c, lista)) : vcCat(c, lista));
  return `<label class="f" for="${idDe(k)}">${esc(rot)}</label><select id="${idDe(k)}" data-k="${k}"><option value="">Elija</option>${ops.map(x =>
    `<option value="${esc(x.code)}" ${x.code === v ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>`;
}
function vcEdad(fnac, ref) {
  if (!fnac) return null;
  const a = new Date(fnac + "T00:00:00"), b = new Date((ref || hoyISO()) + "T00:00:00");
  const dias = Math.floor((b - a) / 86400000); if (dias < 0) return null;
  let meses = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth(); if (b.getDate() < a.getDate()) meses--;
  if (dias < 31) return { valor: dias, unidad: "dias" };
  if (meses < 12) return { valor: meses, unidad: "meses" };
  return { valor: Math.floor(meses / 12), unidad: "años" };
}
const vcAnios = d => d.edad_unidad === "años" ? Number(d.edad_valor) : 0;
function nuevaDosisVc(c) {
  return { dosis_uuid: uuid(), vacuna: "", dosis: "", fuente_dato: "aplicada_actividad", aplicada_durante_actividad: true,
    fecha_aplicacion: c.jornada.fecha || hoyISO(), lote: "", fabricante: "", sitio_aplicacion: "", via_administracion: "",
    vacunador: Estado.entrevistador, observacion: "" };
}
function nuevoVc(c) {
  Estado.editando = { uuid: uuid(), cfg: cfgId(c), tipo_reg: "PERSONA", estado: "BORRADOR", entrevistador: Estado.entrevistador,
    fecha: c.jornada.fecha || hoyISO(), creado: new Date().toISOString(),
    persona: { tipo_identificacion: "cedula", numero_identificacion: "", nombre: "", apellido: "", nombre_madre: "", telefono: "" },
    demo: { fecha_nacimiento: "", edad_valor: "", edad_unidad: "años", sexo: null, tipo_paciente: "", embarazada: null, semanas_gestacion: "" },
    proc: { distrito: c.jornada.distrito || "", corregimiento: c.jornada.corregimiento || "", cod_geo: "", comunidad: c.jornada.comunidad || "", direccion: "" },
    condiciones: [], antecedente: { verificado: false, fuente: "", carnet: false, esquema_completo: "", observacion: "" },
    dosis: [nuevaDosisVc(c)], motivo_no_vacunacion: "", observaciones: "" };
  Estado.vcAbiertos = new Set([Estado.editando.dosis[0].dosis_uuid]);
  pintar(); window.scrollTo(0, 0);

function validarVc(c, r) {
  const e = [], a = [], p = r.persona, d = r.demo;
  if (!String(p.nombre || "").trim() || !String(p.apellido || "").trim()) e.push("Faltan el nombre y el apellido.");
  if (p.tipo_identificacion && p.tipo_identificacion !== "no_tiene" && !String(p.numero_identificacion || "").trim()) e.push("Falta el número de identificación.");
  if (p.tipo_identificacion === "cedula" && p.numero_identificacion && !CEDULA_RE.test(p.numero_identificacion)) a.push("La cédula no tiene el formato habitual (por ejemplo 4-123-456).");
  if ((p.tipo_identificacion === "no_tiene" || (d.edad_unidad !== "años" || vcAnios(d) < 18)) && !String(p.nombre_madre || "").trim()) a.push("Anote el nombre de la madre: es un menor o no tiene identificación.");
  if (!d.fecha_nacimiento) e.push("Falta la fecha de nacimiento.");
  else if (d.fecha_nacimiento > (r.fecha || hoyISO())) e.push("La fecha de nacimiento es posterior a la del registro.");
  if (!vcCat(c, "sexo").some(x => x.code === d.sexo)) e.push("Falta el sexo.");
  if (d.embarazada === "si" && !String(d.semanas_gestacion || "").trim()) e.push("Faltan las semanas de gestación.");
  (r.dosis || []).forEach((x, i) => {
    const n = i + 1;
    if (!x.vacuna || !x.dosis) e.push(`Dosis ${n}: elija la vacuna y la dosis.`);
    if (x.aplicada_durante_actividad) {
      if (!x.fecha_aplicacion) e.push(`Dosis ${n}: falta la fecha de aplicación.`);
      if (!String(x.lote || "").trim()) e.push(`Dosis ${n}: falta el lote.`);
      if (x.fecha_aplicacion && x.fecha_aplicacion > hoyISO()) e.push(`Dosis ${n}: la fecha de aplicación es futura.`);
    }
    const vac = vcCat(c, "vacunas").find(v => v.code === x.vacuna);
    if (vac && x.via_administracion && vac.vias && !vac.vias.includes(x.via_administracion)) a.push(`Dosis ${n}: la vía no es la habitual para ${vac.label}.`);
    if (d.fecha_nacimiento && x.fecha_aplicacion && x.fecha_aplicacion < d.fecha_nacimiento) e.push(`Dosis ${n}: aplicada antes del nacimiento.`);
  });
  if (!(r.dosis || []).some(x => x.aplicada_durante_actividad) && !r.motivo_no_vacunacion) a.push("No hay dosis aplicada hoy: anote el motivo de no vacunación.");
  return { e, a };
}
function cabeceraVc(c) {
  const j = c.jornada;
  return `<div class="card"><h1>${esc(c.nombre)}</h1><p class="muted">${esc(j.instalacion.nombre)} · ${esc(j.modalidad.label)} · ${esc(j.contexto_uso.label)}</p>
    <p class="small muted">${esc([j.comunidad, j.corregimiento, j.distrito].filter(Boolean).join(", "))} · ${esc(c.ref)}</p></div>`;
}

    <div class="card"><p>${plural(pp.length, "persona registrada", "personas registradas")} · ${plural(aplicadas, "dosis aplicada", "dosis aplicadas")} en esta jornada.</p></div>

      return filaPf(r, [r.persona.nombre, r.persona.apellido].filter(Boolean).join(" ") || "(sin nombre)",
        (ap ? "Aplicadas: " + ap : r.motivo_no_vacunacion ? "No vacunada: " + vcLab(c, "motivo_no_vacunacion", r.motivo_no_vacunacion) : "Sin dosis aplicada"));
    }).join("") || `<p class="muted">Todavía no hay personas. Toque <b>+ Persona</b>.</p>`}</div>`;

}

      <div class="row"><div>${vcSelect(c, pre + "vacuna", "Vacuna", "vacunas", x.vacuna)}</div><div>${vcSelect(c, pre + "dosis", "Dosis", "dosis", x.dosis)}</div></div>

      ${x.aplicada_durante_actividad ? `<div class="row"><div>${pfTexto(pre + "lote", "Lote", x.lote)}</div><div>${vcSelect(c, pre + "fabricante", "Fabricante", "fabricante", x.fabricante)}</div></div>
      <div class="row"><div>${vcSelect(c, pre + "sitio_aplicacion", "Sitio de aplicación", "sitio_aplicacion", x.sitio_aplicacion)}</div><div>${vcSelect(c, pre + "via_administracion", "Vía", null, x.via_administracion, vias)}</div></div>

      ${pfTexto(pre + "observacion", "Observación", x.observacion)}
      <div class="btns"><button class="btn bad" type="button" data-quitar="${i}">Quitar esta dosis</button></div></details>`;
  }).join("");
  $("#app").innerHTML = `<div class="card"><div class="btns" style="margin-top:0"><button class="btn" id="btn_volver" type="button">← Personas</button></div>
    <h1>${nuevo ? "Nueva persona" : esc([p.nombre, p.apellido].filter(Boolean).join(" ") || "Persona")}</h1><p class="small muted">${esc(c.nombre)}</p></div>
    <div class="card"><h2>Identificación</h2>
      <div class="row"><div>${vcSelect(c, "persona.tipo_identificacion", "Tipo de identificación", "tipo_identificacion", p.tipo_identificacion)}</div>
      <div>${p.tipo_identificacion && p.tipo_identificacion !== "no_tiene" ? pfTexto("persona.numero_identificacion", "Número", p.numero_identificacion) : ""}</div></div>
      <div class="row"><div>${pfTexto("persona.nombre", "Nombre", p.nombre)}</div><div>${pfTexto("persona.apellido", "Apellido", p.apellido)}</div></div>
      <div class="row"><div>${pfTexto("persona.nombre_madre", "Nombre de la madre", p.nombre_madre)}</div><div>${pfTexto("persona.telefono", "Teléfono", p.telefono)}</div></div></div>
    <div class="card"><h2>Datos</h2>
      <div class="row"><div>${pfFecha("demo.fecha_nacimiento", "Fecha de nacimiento", d.fecha_nacimiento)}</div>
      <div><label class="f">Edad</label><p style="margin:10px 0">${d.edad_valor !== "" && d.edad_valor != null ? esc(d.edad_valor + " " + d.edad_unidad) : "<span class='muted'>Sale de la fecha de nacimiento</span>"}</p></div></div>
      <label class="f">Sexo</label>${seg("vc:demo.sexo", vcCat(c, "sexo").map(x => [x.code, x.label]), d.sexo)}
      ${vcSelect(c, "demo.tipo_paciente", "Tipo de paciente", "tipo_paciente", d.tipo_paciente)}
      ${mujerFertil ? `<label class="f">¿Embarazada?</label>${seg("vc:demo.embarazada", [["si", "Sí"], ["no", "No"]], d.embarazada)}
        ${d.embarazada === "si" ? `<label class="f" for="vc_sem">Semanas de gestación</label><input type="number" id="vc_sem" data-k="demo.semanas_gestacion" inputmode="numeric" min="1" max="42" value="${esc(d.semanas_gestacion)}">` : ""}` : ""}
      <label class="f">Condiciones (puede marcar varias)</label><div class="seg">${vcCat(c, "condiciones").map(x =>
        `<button type="button" data-chk="condiciones" data-v="${esc(x.code)}" aria-pressed="${(r.condiciones || []).includes(x.code)}">${esc(x.label)}</button>`).join("")}</div></div>
    <div class="card"><h2>Procedencia</h2>
      <div class="row"><div><label class="f" for="vc_dis">Distrito</label><select id="vc_dis" data-k="proc.distrito"><option value="">Elija</option>${distritos.map(x => `<option ${x === pr.distrito ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div><label class="f" for="vc_cor">Corregimiento</label><select id="vc_cor" data-k="proc.cod_geo"><option value="">Elija</option>${corrs.map(g => `<option value="${esc(g.cod)}" ${g.c === pr.corregimiento ? "selected" : ""}>${esc(g.c)}</option>`).join("")}</select></div></div>
      <div class="row"><div>${pfTexto("proc.comunidad", "Comunidad o barriada", pr.comunidad)}</div><div>${pfTexto("proc.direccion", "Dirección o referencia", pr.direccion)}</div></div></div>

      ${pfTexto("antecedente.observacion", "Observación", a.observacion)}</div>

      ${nuevo ? "" : `<button class="btn bad" id="btn_eliminar" type="button">Eliminar</button>`}</div>
      <p class="small muted">Se guarda solo en este equipo, cifrado. Para que llegue a la app hay que enviarlo desde la pestaña Enviar.</p></div>`;
  enlazarVc();
}
function enlazarVc() {
  const r = Estado.editando, c = cfgActiva();
  const redibujar = () => { const y = window.scrollY; pantallaVcEdicion(); window.scrollTo(0, y); };
  const refrescar = () => { const v = validarVc(c, r); $("#vc_val").innerHTML = avisos(v); $("#btn_completa").disabled = v.e.length > 0; };
  $("#btn_volver").onclick = () => { Estado.editando = null; pintar(); };
  $("#app").querySelectorAll("[data-k]").forEach(el => el.onchange = () => {
    const k = el.dataset.k, val = String(el.value).trim();
    setRuta(r, k, val);
    if (k === "demo.fecha_nacimiento") { const e = vcEdad(val, r.fecha); r.demo.edad_valor = e ? e.valor : ""; r.demo.edad_unidad = e ? e.unidad : "años"; return redibujar(); }
    if (k === "proc.distrito") { r.proc.cod_geo = ""; r.proc.corregimiento = ""; return redibujar(); }
    if (k === "proc.cod_geo") { const g = (c.geografia || []).find(z => z.cod === val); r.proc.corregimiento = g ? g.c : ""; }
    if (/^dosis\.\d+\.fuente_dato$/.test(k)) { setRuta(r, k.replace(/fuente_dato$/, "aplicada_durante_actividad"), val === "aplicada_actividad"); return redibujar(); }
    if (/^dosis\.\d+\.(vacuna|dosis)$/.test(k) || k === "persona.tipo_identificacion") return redibujar();
    refrescar();
  });
  $("#app").querySelectorAll("[data-seg]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    const tipo = g.dataset.seg.slice(0, 2), ruta = g.dataset.seg.slice(3);
    const cur = b.getAttribute("aria-pressed") === "true";
    if (tipo === "vb") setRuta(r, ruta, b.dataset.v === "true");
    else setRuta(r, ruta, cur ? null : b.dataset.v);   // tocar de nuevo la deja en blanco
    if (ruta === "demo.sexo" || ruta === "demo.embarazada") return redibujar();
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(tipo === "vb" ? x.dataset.v === b.dataset.v : (!cur && x === b))));
    refrescar();
  }));
  $("#app").querySelectorAll("[data-chk]").forEach(b => b.onclick = () => {
    const lista = getRuta(r, b.dataset.chk) || [], v = b.dataset.v, i = lista.indexOf(v);
    if (i >= 0) lista.splice(i, 1); else lista.push(v);
    setRuta(r, b.dataset.chk, lista); b.setAttribute("aria-pressed", String(i < 0)); refrescar();
  });
  $("#app").querySelectorAll("details[data-mu]").forEach(d => d.ontoggle = () => { if (d.open) Estado.vcAbiertos.add(d.dataset.mu); else Estado.vcAbiertos.delete(d.dataset.mu); });
  $("#app").querySelectorAll("[data-quitar]").forEach(b => b.onclick = () => confirmar("Se quita esta dosis.", "Quitar", async () => { r.dosis.splice(+b.dataset.quitar, 1); redibujar(); }));
  $("#btn_add_d").onclick = () => { const x = nuevaDosisVc(c); r.dosis.push(x); Estado.vcAbiertos.add(x.dosis_uuid); redibujar(); };
  const guardar = async estado => {
    r.estado = estado; r.exportado_en = null; await guardarReg(r); Estado.regs = await leerRegs();
    Estado.editando = null; Estado.aviso = estado === "COMPLETA" ? "Persona guardada." : "Borrador guardado.";
    pintar(); window.scrollTo(0, 0);
  };
  $("#btn_completa").onclick = () => guardar("COMPLETA");
  $("#btn_borrador").onclick = () => guardar("BORRADOR");
  const el = $("#btn_eliminar");
  if (el) el.onclick = () => confirmar("Se elimina a esta persona, con sus dosis, de este equipo.", "Eliminar",
    async () => { await DB.del("reg", r.uuid); Estado.regs = await leerRegs(); Estado.editando = null; pintar(); });
}
/* ── Enviar a Vacunación EIP ─────────────────────────────────────────────── */
async function sobreVc(c, regs) {
  const paquete = { schema_id: c.paquete.schema_id, schema_version: APP_VERSION, ref: c.ref, exported_at: new Date().toISOString(),
    device_id: Estado.device, total: regs.length, registros: regs.map(r => { const x = structuredClone(r); delete x.exportado_en; return x; }) };
  paquete.sha256 = await sha256hex(canon(paquete));
  return sellarSobre(c, paquete, regs.length, paquete.exported_at, { ref: c.ref });
}
function pantallaEnviarVc() {
  const c = cfgActiva(), regs = Estado.regs.filter(r => regCfg(r) === cfgId(c));
  const comp = regs.filter(r => r.estado === "COMPLETA"), pend = comp.filter(r => !r.exportado_en), borr = regs.filter(r => r.estado === "BORRADOR");
  $("#app").innerHTML = `<div class="card"><h2>Enviar a PAICSSCH</h2>
    <p>${plural(pend.length, "persona completa sin enviar", "personas completas sin enviar")} · ${comp.length - pend.length} ya enviadas · ${plural(borr.length, "borrador", "borradores")} (no se envían).</p>
    <p class="small muted">El archivo sale cifrado: solo la app lo puede abrir. Mándelo por WhatsApp o correo a quien lo carga en PAICSSCH, Vacunación sin conexión. Cargarlo dos veces no duplica nada.</p>
    <div id="msg"></div>
    <div class="btns"><button class="btn pri" id="btn_env" type="button" ${pend.length ? "" : "disabled"}>Enviar las ${pend.length} sin enviar</button>
    <button class="btn" id="btn_env_todo" type="button" ${comp.length ? "" : "disabled"}>Volver a enviar todo (${comp.length})</button></div></div>`;
  const env = async lista => {
    try {
      const sobre = await sobreVc(c, lista);
      const nombre = `vacunacion_${c.ref}_${hoyISO()}_${lista.length}personas.json`.replace(/[^A-Za-z0-9_.-]/g, "_");
      const res = await entregarArchivo(nombre, JSON.stringify(sobre));
      if (res === "cancelado") return;
      const ahora = new Date().toISOString();
      for (const r of lista) { r.exportado_en = ahora; await guardarReg(r); }
      Estado.regs = await leerRegs();
      Estado.aviso = res === "compartido" ? `Se compartió el archivo con ${plural(lista.length, "persona", "personas")}.` : `Se descargó ${nombre}. Mándelo a Epidemiología.`;
      Estado.tab = "personas"; pintar();
    } catch (err) { $("#msg").innerHTML = `<div class="aviso bad">No se pudo preparar el archivo: ${esc(err.message || err)}</div>`; }
  };
  $("#btn_env").onclick = () => env(pend);
  $("#btn_env_todo").onclick = () => env(comp);
}

iniciar();
</script>
